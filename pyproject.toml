[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-use"
version = "0.1.0"
description = "A computer-use agent whose decision layer is a System One model, not a frontier LLM."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk>=0.7.0",
    "httpx>=0.27",
    "pyobjc-framework-ApplicationServices>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Speech>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation>=10.3; sys_platform == 'darwin'",
]

[project.optional-dependencies]
cua = ["cua-computer>=0.4.17"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
jev-use = "jev_use.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_use"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: hits the real TypeSafe API or the real screen; deselected in CI"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

[tool.coverage.run]
omit = ["src/jev_use/computers/mac.py", "src/jev_use/computers/cua.py"]

[[tool.mypy.overrides]]
# pyobjc ships no type stubs or py.typed marker. Narrowly scoped to those three
# modules so the rest of the codebase stays strict.
module = ["AppKit", "ApplicationServices", "Quartz", "Speech", "AVFoundation", "Foundation"]
ignore_missing_imports = true
